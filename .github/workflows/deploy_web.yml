name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/108ce70d-macro-tracker
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test macro-api count/portion repair
        run: deno test --allow-env supabase/functions/macro-api/meal_result_repair_test.ts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/flutter-analyze.log 2>&1
          analyze_status=$?
          cat /tmp/flutter-analyze.log
          if [ "$analyze_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          output = Path('/tmp/flutter-analyze.log').read_text(errors='replace')
          diagnostics = [line for line in output.splitlines() if re.match(r'\s*(error|warning) •', line)]
          summary = '\n'.join(diagnostics) or output[-4000:]
          escaped = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=flutter analyze diagnostics::{escaped[:5000]}')
          PY
          fi
          exit "$analyze_status"

      - name: Run Flutter tests
        run: |
          set +e
          flutter test --reporter expanded > /tmp/flutter-test.log 2>&1
          test_status=$?
          cat /tmp/flutter-test.log
          if [ "$test_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          output = Path('/tmp/flutter-test.log').read_text(errors='replace')
          lines = output.splitlines()
          markers = re.compile(r'\(E\)|Expected:|Actual:|Which:|Exception|Error|Some tests failed|Test failed', re.I)
          indexes = [i for i, line in enumerate(lines) if markers.search(line)]
          selected = set()
          for index in indexes:
            selected.update(range(max(0, index - 2), min(len(lines), index + 5)))
          diagnostic_lines = [line for line in lines if any(marker in line for marker in ('TOLERANCE_DIAGNOSTIC', 'OPTIMIZER_DIAGNOSTIC', 'Tolerance settings did not persist', 'Optimizer rejected'))]
          summary = '\n'.join(diagnostic_lines) or output[-5000:]
          escaped = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=flutter test diagnostics::{escaped[:5000]}')
          PY
          fi
          exit "$test_status"

      - name: Verify live Gemini meal analysis through Supabase
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import secrets
          import struct
          import urllib.error
          import urllib.request
          import zlib
          from pathlib import Path

          client = Path('lib/data/macro_sync_service.dart').read_text()
          project_url = re.search(r"static const _projectUrl = '([^']+)'", client).group(1)
          public_key = re.search(r"defaultValue: '([^']+)'", client).group(1)
          endpoint = f"{project_url}/functions/v1/macro-api"
          headers = {'apikey': public_key, 'Content-Type': 'application/json'}

          def post(payload, token=None, timeout=15):
              request_headers = dict(headers)
              if token:
                  request_headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers=request_headers, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as error:
                  raw = error.read().decode('utf-8', errors='replace')
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {'error': raw[:1000]}
                  return error.code, body

          def png_chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          # Tiny valid RGBA PNG, sufficient to exercise Gemini's image input path.
          row = b'\x00' + bytes([196, 96, 40, 255, 48, 128, 56, 255])
          image = b'\x89PNG\r\n\x1a\n'
          image += png_chunk(b'IHDR', struct.pack('>IIBBBBB', 2, 1, 8, 6, 0, 0, 0))
          image += png_chunk(b'IDAT', zlib.compress(row))
          image += png_chunk(b'IEND', b'')

          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          username = f'ci-{run_id}-{attempt}'
          pin = f"{secrets.randbelow(900000) + 100000}"
          status, signed_up = post({'action': 'signup', 'username': username, 'pin': pin})
          if status != 200 or not signed_up.get('token'):
              # Never print the response object: a partial success may include a session token.
              safe_error = signed_up.get('error', 'unexpected signup response')
              raise SystemExit(f'CI profile signup failed: HTTP {status}: {safe_error}')
          token = signed_up['token']
          try:
              text = 'אורז עם פרגיות ואפונה וגזר מבושל בסיר עם 15 גרם שמן, 4 מנות'
              status, response = post({
                  'action': 'analyze_meal',
                  'mode': 'meal',
                  'pro': False,
                  'text': text,
                  'image_base64': base64.b64encode(image).decode(),
                  'mime_type': 'image/png',
              }, token, timeout=45)
              if status != 200:
                  raise SystemExit(f'Live analyze_meal failed: HTTP {status}: {response}')
              result = response.get('result')
              if not isinstance(result, dict) or not isinstance(result.get('items'), list) or not result['items']:
                  raise SystemExit(f'Gemini returned no parsed items: {response}')
              required = {'name', 'search_query', 'grams', 'is_liquid', 'is_assumed_addition', 'calories_per_100g', 'protein_per_100g', 'carbs_per_100g', 'fat_per_100g'}
              for index, item in enumerate(result['items']):
                  if not isinstance(item, dict) or not required.issubset(item):
                      raise SystemExit(f'Invalid item #{index} in Gemini JSON: {item}')
              print(f"Live Gemini E2E passed: HTTP 200, model={response.get('model')}, items={len(result['items'])}, request_id={response.get('request_id')}")

              current_meal = {
                  'meal_title': result.get('meal_title', 'ארוחה'),
                  'items': result['items'],
              }
              status, corrected = post({
                  'action': 'analyze_meal',
                  'mode': 'meal',
                  'pro': False,
                  'current_meal': current_meal,
                  'correction_prompt': 'הוסף 15 גרם טחינה',
              }, token, timeout=45)
              if status != 200:
                  raise SystemExit(f'Live meal correction failed: HTTP {status}: {corrected}')
              corrected_result = corrected.get('result')
              if not isinstance(corrected_result, dict) or not isinstance(corrected_result.get('items'), list) or not corrected_result['items']:
                  raise SystemExit('Gemini correction returned no parsed meal items')
              for index, item in enumerate(corrected_result['items']):
                  if not isinstance(item, dict) or not required.issubset(item):
                      raise SystemExit(f'Invalid corrected item #{index} in Gemini JSON')
              print(f"Live meal correction E2E passed: HTTP 200, items={len(corrected_result['items'])}, request_id={corrected.get('request_id')}")
          finally:
              post({'action': 'logout'}, token)
          PY

      - name: Prepare SQLite WebAssembly assets
        run: dart run sqflite_common_ffi_web:setup

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/macro_tracker/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
